---
# Purpose: install what a real server would already have (the base images ship without sshd).
# Molecule calls this playbook with `molecule prepare`.
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Install OpenSSH Server (RHEL)
      ansible.builtin.dnf:
        name:
          - openssh-server
        state: present
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['distribution'] != "Fedora"

    - name: Install OpenSSH Server (Fedora)
      ansible.builtin.command: dnf -y install openssh-server sudo
      changed_when: false
      when: ansible_facts['distribution'] == "Fedora"

    - name: Install OpenSSH Server and sudo (Debian)
      ansible.builtin.apt:
        name:
          - openssh-server
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install OpenSSH Server (Suse)
      community.general.zypper:
        name:
          - openssh-server
        state: present
      when: ansible_facts['os_family'] == "Suse"

    - name: Install OpenSSH Server (Other)
      ansible.builtin.package:
        name:
          - openssh-server
        state: present
      when:
        - ansible_facts['os_family'] not in ["RedHat", "Debian", "Suse"]

    - name: Start SSHD (RHEL)
      ansible.builtin.systemd:
        name: sshd
        state: started
        enabled: true
      when: ansible_facts['os_family'] == "RedHat"

    - name: Start SSHD (Debian)
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Start SSHD Service (other)
      ansible.builtin.systemd:
        name: sshd
        state: started
        enabled: true
      when:
        - ansible_facts['os_family'] not in ["RedHat", "Debian"]
