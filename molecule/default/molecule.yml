---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

# If you run into issues running molecule test, you may need to increase max inotify instances and watches.
#echo "fs.inotify.max_user_instances=512" | sudo tee -a /etc/sysctl.conf
#echo "fs.inotify.max_user_watches=524288" | sudo tee -a /etc/sysctl.conf
#sudo sysctl -p

driver: {name: containers}

platforms:
# RedHat
  - name: rockylinux10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest # Must use Fully Qualified name of Image and domain to pull from to be compatible with Podman.
    pre_build_image: true
    command: /sbin/init
    privileged: true # Needed for systemd within containers.
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw # Needed for systemd within containers.

  - name: rockylinux9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: fedora44
    image: docker.io/geerlingguy/docker-fedora44-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: fedora43
    image: docker.io/geerlingguy/docker-fedora43-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

# Debian
  - name: ubuntu2604
    image: docker.io/geerlingguy/docker-ubuntu2604-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: ubuntu2404
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: debian13
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: debian12
    image: docker.io/geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

# Oracle
  - name: oraclelinux10
    image: docker.io/library/oraclelinux:10
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: oraclelinux9
    image: docker.io/library/oraclelinux:9
    pre_build_image: true
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

# Amazon
  - name: amazonlinux2027
    image: docker.io/amazonlinux:2027
    pre_build_image: false
    dockerfile: Dockerfile.j2 # Needed for AmazonLinux and OpenSuse emulation within containers.
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: amazonlinux2023
    image: docker.io/library/amazonlinux:2023
    pre_build_image: false
    dockerfile: Dockerfile.j2
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

# Opensuse
  - name: opensuseleap15
    image: docker.io/geerlingguy/docker-opensuseleap15-ansible:latest
    pre_build_image: false
    dockerfile: Dockerfile.j2
    command: /sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
#        - --force-handlers
      ansible_navigator:
        - --mode stdout
        - --pull-policy missing
        - --execution-environment-image ghcr.io/ansible/community-ansible-dev-tools:latest

  playbooks:
    create: create.yml
    converge: converge.yml
    destroy: destroy.yml
    cleanup: cleanup.yml
    prepare: prepare.yml
    side_effect: side_effect.yml
    verify: verify.yml

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy