---
########## Server Hardening Tasks  ##########
- name: Secure Boot and Cron directories
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: yes
    mode: '700'
  loop:
    - /boot
    - /etc/cron.monthly
    - /etc/cron.weekly
    - /etc/cron.daily
    - /etc/cron.hourly

- name: Secure Crontab and SSHD Config
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '600'
  loop:
    - /etc/crontab
    - /etc/ssh/sshd_config

- name: Secure Passwd and Group Files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '644'
  loop:
    - /etc/passwd
    - /etc/group

- name: Secure Shadow Files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '640'
  loop:
    - /etc/shadow
    - /etc/gshadow

- name: Secure Home Dirs
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: yes
    mode: '600'
  loop:
    - /home

- name: Ensure TMP Sticky Bit Enabled
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '1777'
  loop:
    - /tmp
    - /var/tmp

- name: Set Default Umask
  ansible.builtin.lineinfile:
    path: /etc/profile.d/set-umask-for-all-users.sh
    regexp: '^umask'
    line: "{{umask_mode}}"

- name: Lock Down /run/shm and /dev/shm
  ansible.builtin.shell: |
    echo "tmpfs /run/shm tmpfs defaults,noexec,nosuid 0 0" | sudo tee -a /etc/fstab
    echo "tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev 0 0" | sudo tee -a /etc/fstab

########## AuditD Installation ##########
- name: AuditD Installation (RedHat)
  ansible.builtin.yum:
    name: auditd
    state: latest
  when: ansible_os_family == "RedHat"
  notify: restart audit

- name: AuditD Installation (Debian)
  ansible.builtin.dnf:
    name: auditd
    state: latest
  when: ansible_os_family == "Debian"
  notify: restart auditd