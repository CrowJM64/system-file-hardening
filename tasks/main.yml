---
########## Server Hardening Tasks  ##########
- name: Secure Boot and Cron directories
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: yes
    mode: '700'
  loop:
    - /boot
    - /etc/cron.monthly
    - /etc/cron.weekly
    - /etc/cron.daily
    - /etc/cron.hourly

- name: Secure Crontab and SSHD Config
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '600'
  loop:
    - /etc/crontab
    - /etc/ssh/sshd_config

- name: Secure Passwd and Group Files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '644'
  loop:
    - /etc/passwd
    - /etc/group

- name: Secure Shadow Files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '640'
  loop:
    - /etc/shadow
    - /etc/gshadow

- name: Secure Home
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '755'
  loop:
    - /home/

- name: Find User Home Dirs
  ansible.builtin.find:
    paths: /home/
    file_type: directory
  register: home_dirs

- name: Secure User Home Dirs
  ansible.builtin.file:
    path: "{{ item.path }}"
    recurse: yes
    mode: '700'
  loop: "{{ home_dirs.files }}"

- name: Ensure TMP Sticky Bit Enabled
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '1777'
  loop:
    - /tmp
    - /var/tmp

- name: Create Umask Settings File
  ansible.builtin.file:
    path: /etc/profile.d/set-umask-for-all-users.sh
    state: touch
    mode: '0644'

- name: Set Default Umask
  ansible.builtin.lineinfile:
    path: /etc/profile.d/set-umask-for-all-users.sh
    line: "{{umask_mode}}"

- name: Lock Down /run/shm and /dev/shm
  ansible.builtin.shell: |
    echo "tmpfs /run/shm tmpfs defaults,noexec,nosuid 0 0" | sudo tee -a /etc/fstab
    echo "tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev 0 0" | sudo tee -a /etc/fstab

########## AuditD Installation ##########
- name: AuditD Installation (RedHat)
  ansible.builtin.package:
    name: audit
    state: latest
  when: ansible_os_family == "RedHat"
  register: auditd_installed

- name: AuditD Installation (Debian)
  ansible.builtin.package:
    name: auditd
    state: latest
  when: ansible_os_family == "Debian"
  register: auditd_installed

- name: Ensure AuditD is Running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: yes
  when: auditd_installed is succeeded