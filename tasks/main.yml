---
########## Server Hardening Tasks  ##########
- name: Secure Boot and Cron directories
  ansible.builtin.file:
    path: "{{ item }}"
    recurse: yes
    mode: '0700'
  loop:
    - /boot
    - /etc/cron.monthly
    - /etc/cron.weekly
    - /etc/cron.daily
    - /etc/cron.hourly

- name: Check /etc/crontab exists
  stat:
    path: /etc/crontab
  register: etc_crontab_info

- name: Create /etc/crontab
  ansible.builtin.file:
    path: /etc/crontab
    state: touch
    mode: '0600'
  when: not etc_crontab_info.stat.exists

- name: Secure Crontab and SSHD Config
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0600'
  loop:
    - /etc/crontab
    - /etc/ssh/sshd_config

- name: Secure Passwd and Group Files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0644'
  loop:
    - /etc/passwd
    - /etc/group

# Mostly an OpenSuse issue, seemingly not shipping with it by default, but with gpasswd using it when it does exist.
- name: Check if /etc/gshadow exists.
  stat:
    path: /etc/gshadow
  register: gshadow_info

- name: Create gshadow file
  ansible.builtin.file:
    path: /etc/gshadow
    state: touch
    mode: '0640'
  when: not gshadow_info.stat.exists

- name: Secure Shadow Files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0640'
  loop:
    - /etc/shadow
    - /etc/gshadow

- name: Secure Home
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
  loop:
    - /home/

- name: Find User Home Dirs
  ansible.builtin.find:
    paths: /home/
    file_type: directory
  register: home_dirs

- name: Secure User Home Dirs
  ansible.builtin.file:
    path: "{{ item.path }}"
    recurse: yes
    mode: '0700'
  loop: "{{ home_dirs.files }}"

- name: Ensure TMP Sticky Bit Enabled
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '1777'
  loop:
    - /tmp
    - /var/tmp

- name: Check if Umask Settings File Already Exists
  ansible.builtin.stat:
    path: /etc/profile.d/set-umask-for-all-users.sh
  register: umask_bash_info

- name: Create Umask Settings File
  ansible.builtin.file:
    path: /etc/profile.d/set-umask-for-all-users.sh
    state: touch
    mode: '0644'
  when: not umask_bash_info.stat.exists
  register: umask_bash_created

- name: Set Default Umask
  ansible.builtin.lineinfile:
    path: /etc/profile.d/set-umask-for-all-users.sh
    line: "{{umask_mode}}"
  when: umask_bash_created is changed

- name: Check /etc/fstab exists # For Molecule, certain containers do not ship with fstab and therefore fail.
  ansible.builtin.stat:
    path: /etc/fstab
  register: fstab_info

- name: Lock Down /dev/shm
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*#?\s*\S+\s+/dev/shm\s'
    line: 'tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev 0 0'
    backup: yes
  when: fstab_info.stat.exists

########## AuditD Installation ##########
- name: Install python3-dnf (Fedora) # Pre-req for Fedora DNF Tasks
  ansible.builtin.command: dnf -y install python3-dnf
  changed_when: false
  when: ansible_facts['distribution'] == "Fedora"

- name: Install AuditD (RedHat)
  ansible.builtin.package:
    name: audit
    state: latest
  when:
    - ansible_facts['os_family'] in ["RedHat", "Suse"]
  register: auditd_installed

- name: Install AuditD (Debian)
  ansible.builtin.package:
    name: auditd
    state: latest
  when: ansible_facts['os_family'] == "Debian"
  register: auditd_installed

- name: Install OpenSSH Server and sudo (Other)
  ansible.builtin.package:
    name:
      - auditd
    state: present
  when:
    - ansible_facts['os_family'] not in ["RedHat", "Debian", "Suse"]
  register: auditd_installed

- name: Ensure AuditD is Running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: yes
  when: 
    - auditd_installed is succeeded
    - ansible_facts['virtualization_type'] not in ["docker", "podman", "container", "containerd", "lxc"] # AuditD cannot run on containerized linux images.